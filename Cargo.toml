[package]
name = "tauri-plugin-fontgres"
version = "0.1.0"
authors = ["ayangweb", "Seferino Fernandez"]
description = "Tauri v2 plugin that lists the system's fonts and answers CSS-style font queries, built on fontgres."
repository = "https://github.com/seferino-fernandez/tauri-plugin-fontgres"
keywords = ["tauri", "tauri-plugin", "fonts", "system-fonts", "fontgres"]
categories = ["gui", "text-processing"]
license = "MIT"
edition = "2024"
rust-version = "1.100"
exclude = ["/examples", "/dist-js", "/guest-js", "/node_modules"]
links = "tauri-plugin-fontgres"

[dependencies]
tauri = { version = "2" }
serde = "1"
thiserror = "2"
fontdb = "0.23"

[build-dependencies]
tauri-plugin = { version = "2", features = ["build"] }
